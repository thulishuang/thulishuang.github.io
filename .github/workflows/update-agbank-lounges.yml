name: Update AgBank Lounge Data

on:
  workflow_dispatch:
  schedule:
    # Every day at 20:23 UTC = 04:23 Asia/Shanghai next day
    - cron: '23 20 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: python -m pip install -r agbank-lounge-finder/requirements.txt

      - name: Keep previous data for comparison
        run: cp agbank-lounge-finder/data/lounges.json /tmp/agbank-lounges.old.json

      - name: Build lounge data from URLs
        run: |
          python agbank-lounge-finder/scripts/build_data.py \
            --auto-overseas-url \
            --domestic-html-url https://agbank-visa-lounge-finder.pages.dev/agbank_visa_domestic_lounge_finder \
            --output agbank-lounge-finder/data/lounges.json

      - name: Avoid committing timestamp-only changes
        run: |
          python - <<'PY'
          import json, shutil
          from pathlib import Path
          old_path = Path('/tmp/agbank-lounges.old.json')
          new_path = Path('agbank-lounge-finder/data/lounges.json')
          old = json.loads(old_path.read_text())
          new = json.loads(new_path.read_text())
          if old.get('records') == new.get('records'):
              shutil.copyfile(old_path, new_path)
              print('Records unchanged; restored previous JSON to avoid timestamp-only commit.')
          else:
              print('Records changed; keeping rebuilt JSON.')
          PY

      - name: Commit changes if data changed
        run: |
          if git diff --quiet -- agbank-lounge-finder/data/lounges.json; then
            echo "No lounge data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agbank-lounge-finder/data/lounges.json
          git commit -m "Update AgBank lounge data"
          git push
