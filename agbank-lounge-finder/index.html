<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0f6b4f" />
  <title>农行信用卡机场贵宾厅查询</title>
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
  <header class="hero">
    <nav class="topbar" aria-label="页面导航">
      <a href="#results" class="brand">ABC Lounge Finder</a>
      <div class="navlinks">
        <a href="#filters">筛选</a>
      </div>
    </nav>
    <section class="hero-inner">
      <div>
        <p class="eyebrow">农行信用卡 / 机场贵宾厅</p>
        <h1>境内、境外机场贵宾厅一站式查询</h1>
        <p class="lead">支持关键词、城市、机场、航站楼、安检类型筛选；可导出 CSV。数据通过仓库自动任务定期更新。</p>
      </div>
      <aside class="source-card" aria-live="polite">
        <strong>数据状态</strong>
        <span id="data-status">正在加载内置数据…</span>
        <small id="data-generated">—</small>
      </aside>
    </section>
  </header>

  <main class="container">
    <section class="stats" id="stats" aria-label="数据统计">
      <div><strong id="stat-total">0</strong><span>位置记录</span></div>
      <div><strong id="stat-domestic">0</strong><span>境内</span></div>
      <div><strong id="stat-overseas">0</strong><span>境外</span></div>
      <div><strong id="stat-airports">0</strong><span>机场 / 站点</span></div>
    </section>

    <section class="panel filters" id="filters">
      <div class="section-title">
        <div>
          <p class="eyebrow">筛选</p>
          <h2>查找贵宾厅</h2>
        </div>
        <div class="result-count"><span id="result-count">0</span> 条结果</div>
      </div>
      <div class="filter-grid">
        <label class="field wide">
          <span>关键词</span>
          <input id="q" type="search" placeholder="机场 / 城市 / IATA / 贵宾厅 / 位置，如：HKG、东京、白云、T3" autocomplete="off" />
        </label>
        <label class="field">
          <span>范围</span>
          <select id="scope"></select>
        </label>
        <label class="field">
          <span>洲 / 省份</span>
          <select id="region"></select>
        </label>
        <label class="field">
          <span>国家 / 地区</span>
          <select id="country"></select>
        </label>
        <label class="field">
          <span>城市</span>
          <select id="city"></select>
        </label>
        <label class="field">
          <span>机场 / 站点</span>
          <select id="airport"></select>
        </label>
        <label class="field">
          <span>航站楼</span>
          <select id="terminal"></select>
        </label>
        <label class="field">
          <span>安检类型</span>
          <select id="security"></select>
        </label>
        <label class="field">
          <span>出发类型</span>
          <select id="departure"></select>
        </label>
        <label class="field">
          <span>排序</span>
          <select id="sort">
            <option value="default">默认顺序</option>
            <option value="airport">机场 / 航站楼</option>
            <option value="city">国家地区 / 城市</option>
            <option value="scope">范围 / 地区</option>
          </select>
        </label>
      </div>
      <div class="filter-actions">
        <button class="btn" id="clear-filters" type="button">清空筛选</button>
        <button class="btn" id="export-csv" type="button">导出 CSV</button>
      </div>
    </section>

    <section id="results" class="results" aria-live="polite"></section>
    <div class="load-more-wrap">
      <button class="btn primary" id="load-more" type="button" hidden>显示更多</button>
    </div>

  </main>

  <template id="card-template">
    <article class="lounge-card">
      <div class="card-head">
        <div>
          <div class="badges"></div>
          <h3></h3>
          <p class="route"></p>
        </div>
        <div class="iata"></div>
      </div>
      <div class="chips"></div>
      <p class="directions"></p>
      <details>
        <summary>服务与使用规则</summary>
        <dl class="details-list"></dl>
      </details>
      <div class="card-actions">
        <button class="btn small copy-btn" type="button">复制位置</button>
      </div>
    </article>
  </template>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="assets/app.js" defer></script>
</body>
</html>
